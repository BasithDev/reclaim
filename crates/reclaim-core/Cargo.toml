# reclaim-core: the scanning engine (disks, directory tree, sizes, snapshots, growth diff).
# Owned by agent A1. Pure library: no Tauri, no UI code.
[package]
name = "reclaim-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
thiserror.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"
