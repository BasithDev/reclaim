# Reclaim: Cargo workspace root.
# Ties together the Tauri app (src-tauri) and the two engine crates (crates/*)
# so they share one target/ directory and one Cargo.lock.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/reclaim-core", "crates/reclaim-cleaners"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Basith"]
repository = "https://github.com/BasithDev/reclaim"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Release profile for the shipped app (moved here from src-tauri: profiles only apply at workspace root).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep dev builds reasonably fast for scanning large trees.
[profile.dev.package."*"]
opt-level = 2
